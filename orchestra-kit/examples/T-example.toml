# 예시 패킷 (Python). 다른 언어도 구조는 같습니다.
id    = "T-014"
title = "할인 적용 시 세금 이중 계산 수정"
tier  = 2

goal = """
Invoice.total()이 할인이 있을 때 세금을 두 번 더하지 않는다.
할인 → 세금 순서로 한 번만 계산한다.
"""

[scope]
allow = ["src/billing/invoice.py", "tests/billing/test_invoice_discount.py"]
forbid = []
max_files = 2
max_diff_lines = 80

[context]
hints = [
  "src/billing/invoice.py: Invoice.total() — tax applied in both _subtotal() and total()",
  "src/billing/tax.py: apply_tax() is the single source of truth for rounding",
]

[acceptance]
cases = [
  "Invoice(100, discount=10, tax_rate=0.1).total() == 99.0",
  "Invoice(100, discount=0, tax_rate=0.1).total() == 110.0",
  "Invoice(0, discount=0, tax_rate=0.1).total() == 0.0",
]
commands = ["python -m pytest -q tests/billing"]

[limits]
max_attempts = 3
