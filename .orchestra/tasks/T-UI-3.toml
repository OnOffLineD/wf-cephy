# Task packet T-UI-3
id    = "T-UI-3"
title = "컴패니언 앱에 2도 아이콘 및 HudButton/모핑 탭 바 전면 연동"
tier  = 2

goal = """
scripts/desktop_companion.py의 텍스트/이모지 버튼을 scripts/hud_widgets.py의 HudButton 및 2도 탭 바로 전면 교체 연동한다.
1. 탭 바 교체:
   - self.tab_bar.add_tab('채팅', icon_name='chat')
   - self.tab_bar.add_tab('숙제', icon_name='todo')
   - self.tab_bar.add_tab('현황', icon_name='status')
2. 헤더 버튼 교체:
   - persona_btn: HudButton('', icon_name='persona', icon_only=True)로 교체하고 툴팁 유지
   - close_btn: HudButton('', icon_name='close', icon_only=True)로 교체하고 animate_hide 연결
3. 퀵 액션 툴바(action_bar) 버튼 교체:
   - btn_full: HudButton('화면 캡처 [F9]', icon_name='capture', icon_only=True)
   - btn_clip: HudButton('붙여넣기 [Ctrl+V]', icon_name='clipboard', icon_only=True)
   - btn_refresh: HudButton('실시간 갱신', icon_name='refresh', icon_only=True)
   - 툴바 레이아웃 높이 및 간격 자연스럽게 정돈
4. 입력창 및 현황 탭 버튼 교체:
   - btn_send: HudButton('전송', icon_name='send', icon_only=False)
   - refresh_btn: HudButton('새로고침', icon_name='refresh', icon_only=True)
5. 비지 상태 피드백 연동:
   - refresh_world_events 실행 시 btn_refresh.set_busy(True) 구동 및 완료 시 False 처리
6. 하위 호환 및 테스트:
   - 기존 시그널/슬롯 연결 및 단축키 바인딩 100% 보존
   - tests/test_companion_ui_tabs.py에서 헤드리스 기동 및 탭 전환 정상 확인
"""

[scope]
allow = [
  "scripts/desktop_companion.py",
  "tests/test_companion_ui_tabs.py"
]
forbid = [
  "scripts/warframe_damage_engine.py",
  "scripts/screen_mod_analyzer.py"
]
max_files = 2
max_diff_lines = 220

[context]
hints = [
  "scripts/hud_widgets.py: HudButton (호버 언폴딩, 2도 글리프, set_busy 지원)",
  "scripts/morphing_tab_bar.py: add_tab(text, icon_name)",
  "scripts/desktop_companion.py:428-566: header, tab_bar, action_bar, input_bar, status_header"
]

[acceptance]
cases = [
  "app.tab_bar.tabs[0]['icon_name'] == 'chat'",
  "isinstance(app.btn_full, HudButton)",
  "isinstance(app.btn_clip, HudButton)",
  "isinstance(app.btn_refresh, HudButton)",
  "isinstance(app.btn_send, HudButton)",
  "이모지 텍스트('💬', '🖥️', '🎭' 등) 완전 제거"
]
commands = [
  "python -m pytest tests/test_companion_ui_tabs.py -v"
]

[limits]
max_attempts = 3
