# Task packet. Written by the orchestrator (CEO), never by the builder.
id    = "T-PET-3"
title = "인게임 키입력 연동 펫 모션 ON/OFF 완벽 차단 및 설정창 연동"
tier  = 2

goal = """
워프레임 인게임 키입력(WASD, Space, E, 마우스) 연동 펫 모션(GameInputListener)에 대해, 핵(Anti-Cheat) 오인식 걱정 해소 및 사용자 선호 반영을 위한 설정창 ON/OFF 토글과 완벽 차단(Zero-Trace Blocking) 로직을 구현한다.

[요구사항 및 완벽 차단 3중 방어선]
1. scripts/game_input_listener.py 완벽 차단 로직:
   - GameInputListener에 enabled: bool 속성 및 set_enabled(self, enabled: bool) 메서드 추가.
   - OFF (enabled=False) 시:
     * self.timer.stop() 호출로 50ms 주기 폴링 루프 완전 정지 (timer.isActive() == False).
     * self._release_all() 즉각 호출로 잔류 입력 상태 초기화 및 펫 안정 상태 복귀.
     * poll() 시작부에 if not self.enabled: return 가드를 두어, user32.GetAsyncKeyState 및 GetForegroundWindow 호출이 0회(Zero Calls)가 되도록 원천 차단.
   - ON (enabled=True) 시: start() 또는 resume() 호출 시 timer 정상 재기동.

2. scripts/persona_manager.py 설정 영속화:
   - get_motion_enabled(self) -> bool (기본값 True)
   - set_motion_enabled(self, enabled: bool) 메서드 추가 및 persona_config.json 저장/로드.

3. scripts/persona_dialog.py 설정창 UI 연동:
   - 2번째 탭("로컬 모델 & 엔진")에 인게임 모션 ON/OFF 체크박스 및 안내 가이드 추가:
     * cb_motion = QCheckBox("워프레임 인게임 입력 연동 펫 반응 모션 활성화 (WASD / Space / E / 마우스)")
     * 안내 문구: "💡 워프레임 창 활성화 시에만 키를 감지해 펫이 점프/참격 모션을 취합니다. 비활성화 시 모든 키 감지 폴링(GetAsyncKeyState)과 백그라운드 타이머가 완전히 차단(OFF)됩니다."
   - save() 시 persona_manager.set_motion_enabled(self.cb_motion.isChecked()) 저장.
   - 기존 감정표현(표정, 립싱크 대화 입모양, 제스처, 부유 모션 등)은 이 옵션과 무관하게 100% 정상 작동함을 보존.

4. scripts/desktop_companion.py 실시간 핫 토글 연동:
   - DesktopPet 초기화 시 get_motion_enabled()를 읽어 OFF인 경우 input_listener.start()를 호출하지 않음.
   - DesktopPet.set_motion_enabled(self, enabled: bool) 메서드 추가:
     * self.input_listener.set_enabled(enabled)
     * if not enabled: self.avatar.set_mood("idle") (혹은 잔류 모션 리셋)
   - open_settings_dialog()에서 다이얼로그 닫힌 후 motion_enabled 변경이 감지되면 self.pet.set_motion_enabled()를 즉각 호출하여 앱 재시작 없이 실시간 적용하고 채팅 안내 출력.

5. 테스트 보강:
   - tests/test_game_input_listener.py: enabled=False 시 timer.stop(), _release_all() 호출, GetAsyncKeyState 호출 0회 검증 케이스 추가.
   - tests/test_settings_and_frameless_dialogs.py: 설정창 모션 체크박스 저장 및 persona_manager 영속성 검증.
"""

[scope]
allow = [
  "scripts/game_input_listener.py",
  "scripts/persona_manager.py",
  "scripts/persona_dialog.py",
  "scripts/desktop_companion.py",
  "tests/test_game_input_listener.py",
  "tests/test_settings_and_frameless_dialogs.py"
]
forbid = []
max_files = 6
max_diff_lines = 180

[context]
hints = [
  "scripts/game_input_listener.py: GameInputListener - enabled 속성, set_enabled(bool), timer.stop(), poll() 가드",
  "scripts/persona_manager.py: PersonaManager - get_motion_enabled(), set_motion_enabled(bool)",
  "scripts/persona_dialog.py: OrdisPersonaDialog - cb_motion 체크박스 및 save() 연동",
  "scripts/desktop_companion.py: DesktopPet - set_motion_enabled(bool), open_settings_dialog() 핫 토글 연동",
  "tests/test_game_input_listener.py: test_game_input_listener_disabled_stops_timer_and_no_api_calls",
  "tests/test_settings_and_frameless_dialogs.py: test_settings_motion_enabled_toggle"
]

[acceptance]
cases = [
  "listener.set_enabled(False) -> listener.timer.isActive() is False and _get_async_key_state calls == 0",
  "sm.set_motion_enabled(False) -> sm.get_motion_enabled() is False",
  "dlg.cb_motion.setChecked(False) -> dlg.save() -> sm.get_motion_enabled() is False"
]
commands = [
  "python -m pytest tests/test_game_input_listener.py tests/test_settings_and_frameless_dialogs.py -q"
]

[limits]
max_attempts = 3
