# Task packet. Written by the orchestrator (CEO), never by the builder.
id    = "T-UI-7"
title = "설정창 HUD 아이콘 적용 및 버튼 UI 디자인 고도화"
tier  = 2

goal = """
워프레임 컴패니언 설정창(OrdisPersonaDialog)의 모델, GPU, 컨텍스트 길이 설정 섹션 및 찾아보기 버튼에 하드코딩된 유니코드 텍스트 이모지(🧠, 📏, ⚡, 📁, 📦, 🎲 등)를 완전히 제거하고,
assets/icons/에 새롭게 추가된 Warframe 오로킨 다크 SF 테마의 고화질 HUD 글리프 아이콘(model.png, gpu.png, context.png, browse.png)과 load_icon_pixmap을 연동하여 일관되고 세련된 디자인으로 고도화한다.

1. 로컬 모델 & 엔진 탭 (Tab 2) 섹션 헤더:
   - sec1_title (모델 파일 지정): 🧠 대신 load_icon_pixmap('model') 아이콘 (18x18 ~ 20x20) + 텍스트 라벨 '로컬 GGUF 모델 파일 지정' 레이아웃 구성
   - sec2_title (컨텍스트 길이): 📏 대신 load_icon_pixmap('context') 아이콘 + 텍스트 라벨 '컨텍스트 길이 (Context Size / Token Window)' 구성
   - sec3_title (GPU 가속): ⚡ 대신 load_icon_pixmap('gpu') 아이콘 + 텍스트 라벨 'GPU 가속 레이어 수 (n_gpu_layers)' 구성
2. 파일 찾아보기 버튼 (btn_browse):
   - 📁 이모지 제거 후 load_icon_pixmap('browse')를 아이콘(setIcon, setIconSize)으로 지정하고 텍스트는 ' 찾아보기'로 설정. 워프레임 HUD 버튼 스타일에 맞게 다듬기.
3. 컨텍스트 길이 빠른 프리셋 버튼 (2048, 4096, 8192, 16384):
   - HUD 칩 버튼 스타일 (선택 값과 일치할 때 시안 블루 강조 등 가시성 향상).
4. 페르소나 탭 (Tab 1) 및 콤보박스 정돈:
   - 라디오 버튼들의 저화질 이모지(🎲, 🛡️, ⚡, 🎯, ✏️)를 정돈하여 [랜덤 변주], [충성스러운 집사], [글리치 모드], [냉철한 전술장교], [사용자 직접 설정] 스타일로 세련되게 정리.
   - 콤보박스 항목의 '📦 ' 텍스트 이모지 제거.
5. 기존 설정 저장 및 로드 기능, 헤드리스 테스트 및 다이얼로그 동작 100% 호환 유지.
"""

[scope]
allow = [
  "scripts/persona_dialog.py",
  "tests/test_settings_and_frameless_dialogs.py",
  "tests/test_persona_customization.py"
]
forbid = [
  "orchestra.py",
  "AGENTS.md",
  "GEMINI.md"
]
max_files = 3
max_diff_lines = 250

[context]
hints = [
  "scripts/persona_dialog.py: OrdisPersonaDialog.init_ui() - Tab 2 (model_tab)의 sec1_title, sec2_title, sec3_title을 load_icon_pixmap('model'), load_icon_pixmap('context'), load_icon_pixmap('gpu')를 포함하는 수평 헤더 레이아웃으로 교체",
  "scripts/persona_dialog.py: self.btn_browse - load_icon_pixmap('browse')를 setIcon 및 setIconSize(QSize(18, 18))로 적용하고 텍스트 ' 찾아보기' 지정",
  "scripts/persona_dialog.py: Tab 1의 라디오 버튼(self.radio_random 등) 및 self.lbl_custom_title, 콤보박스에서 이모지 제거 및 워프레임 배지 스타일 적용",
  "scripts/hud_widgets.py: load_icon_pixmap(icon_name) - assets/icons/<icon_name>.png을 로딩하여 QPixmap 반환 (model, gpu, context, browse 사용 가능)"
]

[acceptance]
cases = [
  "Tab 2 section headers use load_icon_pixmap for model, context, and gpu icons",
  "btn_browse uses browse icon from load_icon_pixmap('browse')",
  "No hardcoded emojis (🧠, 📏, ⚡, 📁, 📦, 🎲) remain in section headers and browse button of OrdisPersonaDialog",
  "Existing test suites test_settings_and_frameless_dialogs.py and test_persona_customization.py pass cleanly"
]
commands = [
  "python -m pytest -q tests/test_settings_and_frameless_dialogs.py",
  "python -m pytest -q tests/test_persona_customization.py"
]

[limits]
max_attempts = 3
