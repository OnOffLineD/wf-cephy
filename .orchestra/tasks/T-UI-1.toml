# Task packet T-UI-1
id    = "T-UI-1"
title = "2도 HUD 글리프 렌더러 및 언폴딩 HudButton 구현"
tier  = 2

goal = """
scripts/hud_widgets.py에 PySide6/PyQt6 호환 HudButton 위젯과 2도 글리프 렌더러를 구현하고, tests/test_hud_widgets.py로 단위 검증한다.
1. HudButton (QAbstractButton 상속):
   - 캡슐 형태(높이 약 28~32px, border-radius 14~16px, 어두운 반투명 배경 rgba(12, 16, 23, 0.88))
   - icon_name ('capture', 'clipboard', 'refresh', 'send', 'persona', 'close', 'chat', 'todo', 'status' 등) 또는 icon_path를 지원하며 assets/icons/<name>.png를 로드하거나 렌더링.
   - 기본 상태: 아이콘만 노출되는 콤팩트 알약 형태 (너비 약 32px, icon_only=True 모드 지원)
   - 호버(enterEvent/leaveEvent) 및 포커스: QVariantAnimation으로 hover_t(0.0 -> 1.0)를 150~200ms 동안 보간.
     * sizeHint()의 너비가 32px -> (icon + 텍스트 라벨 + 패딩)으로 부드럽게 언폴딩(확장)되며 updateGeometry() 호출
     * 호버 시 테두리 시안(#00e5ff) 강조 및 모서리 텐노 조준 브래킷('⌐ ¬') 페이드인
   - 클릭(mousePressEvent): press_t(0 -> 1 -> 0) 감쇠 리플 애니메이션
   - busy 속성: True일 때 회전하는 시안 호(Arc) 또는 펄스 애니메이션 구동 (화면 캡처/분석/갱신 대기용)
   - 렌더링 원칙: 애니메이션 중 setStyleSheet()나 QGraphicsEffect를 일체 사용하지 않고 QPainter 직접 렌더링으로 60fps 유지.
2. 단위 테스트 (tests/test_hud_widgets.py):
   - QT_QPA_PLATFORM=offscreen 환경에서 헤드리스 실행
   - 기본 상태 sizeHint().width() == 32 (icon_only 언폴딩 전)
   - hover_t=1.0 도달 시 sizeHint().width()가 라벨 포함 너비로 확장됨을 확인
   - clicked 시그널 발생 확인
   - busy=True 설정 시 타이머/애니메이션 활성화 확인
"""

[scope]
allow = [
  "scripts/hud_widgets.py",
  "tests/test_hud_widgets.py"
]
forbid = [
  "scripts/desktop_companion.py",
  "scripts/morphing_tab_bar.py"
]
max_files = 2
max_diff_lines = 400

[context]
hints = [
  "assets/icons/ : chat.png, todo.png, status.png, capture.png, clipboard.png, refresh.png, persona.png, send.png (128x128 2도 투명 PNG)",
  "scripts/desktop_companion.py:438-485 : 교체 대상이 될 텍스트 이모지 버튼들의 툴팁, 단축키 및 시그널 인터페이스",
  "scripts/morphing_tab_bar.py : 기존 탭 바 구조 참조"
]

[acceptance]
cases = [
  "HudButton('화면 캡처 [F9]', icon_name='capture', icon_only=True) 생성 시 초기 sizeHint().width() == 32",
  "hover_t = 1.0 시 sizeHint().width() > 32",
  "btn.click() 시 clicked 시그널 정상 수신",
  "btn.set_busy(True) 시 is_busy == True"
]
commands = [
  "python -m pytest tests/test_hud_widgets.py -v"
]

[limits]
max_attempts = 3
