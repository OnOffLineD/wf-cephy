id    = "T-DMG-UI-1"
title = "데미지 분석 결과 시각화 (2안 시뮬레이터 + 3안 2x4 레이더 하이브리드)"
tier  = 2

goal = """
scripts/damage_breakdown_dialog.py의 단순 텍스트 나열 방식을 게이밍 대시보드(2안+3안 결합 하이브리드) 형태로 전면 개편한다.
1. 상단 4대 네온 KPI 요약 카드 (기대 DPS, 버스트 DPS, Peak 크리, Trough 크리) 배치.
2. 탭 1 [실전 전투 시뮬레이터 (Option 2)]: 적 타겟 선택(강철의 길 그리니어 헤비거너 Lv 150/225, 봄바드, 코퍼스 등), 상황 토글(헤드샷 x3, 바이럴 10스택 x4.25, 부식 방깎, 아케인 풀스택), 방어력 감쇄 후 실효 DPS 및 처치 소요 시간(TTK) 실시간 연산.
3. 탭 2 [빌드 2x4 슬롯 & 6각 성향 레이더 (Option 3)]: 2x4 인게임 모드 카드 비주얼 복원(호버 시 옵션 및 단독 DPS 기여도 툴팁), 6축 방사형 성향 레이더 차트, 오디스의 합연산 누수/누락 시너지 약점 진단 배지.
4. 탭 3 [계산 단계 (Calculation Steps)]: 기존 상세 수식 검증 카드 보존.
5. tests/test_damage_dashboard_tabs.py를 작성하여 100% 검증한다.
"""

[scope]
allow = [
  "scripts/damage_breakdown_dialog.py",
  "tests/test_damage_dashboard_tabs.py"
]
forbid = [
  "rules/**"
]
max_files = 2
max_diff_lines = 500

[context]
hints = [
  "scripts/frameless_dialog.py: FramelessDialog 상속, paintEvent 다크 불투명 배경(#0c1017) 유지",
  "scripts/warframe_damage_engine.py: compute_metrics() 결과 데이터(w_meta, mod_objs, metrics, riven_stats) 참조",
  "Option 2 타겟: Steel Path Lv 150 Heavy Gunner (Ferrite Armor 방어력 공식: BaseArmor * (1 + ((Level - BaseLevel)^1.75 * 0.005)))",
  "Option 3 레이더: QPainter.drawPolygon()을 이용한 6각 방사형 스탯 차트 렌더링",
  "PySide6 / PyQt6 크로스 런타임 호환성 try...except 유지"
]

[acceptance]
cases = [
  "DamageBreakdownDialog가 3개 탭(전투 시뮬레이터, 비주얼 2x4 및 성향 레이더, 상세 수식)을 정상 렌더링함",
  "전투 시뮬레이터에서 헤드샷 또는 바이럴 토글 시 실효 DPS 및 TTK가 즉시 동적 갱신됨",
  "2x4 모드 그리드에 장착된 모드 카드가 표시되고 약점 진단 배지가 생성됨",
  "pytest tests/test_damage_dashboard_tabs.py 100% 통과"
]
commands = [
  "python -m pytest tests/test_damage_dashboard_tabs.py"
]

[limits]
max_attempts = 3
