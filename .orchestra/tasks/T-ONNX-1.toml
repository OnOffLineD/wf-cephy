id    = "T-ONNX-1"
title = "YOLO 슬롯 탐지기 ONNX 전환 및 PyTorch 의존성 완전 제거"
tier  = 2

goal = """
scripts/yolo_slot_detector.py에서 ultralytics/torch 의존성을 완전히 제거하고,
이미 준비된 models/slot_detector.onnx 모델을 onnxruntime(및 cv2/numpy)으로 구동하도록 리팩토링한다.
detect_layout()의 기존 인터페이스 및 반환 구조를 100% 유지하며, 신규 단위 테스트 tests/test_yolo_slot_detector.py를 작성하여 검증한다.
"""

[scope]
allow = [
  "scripts/yolo_slot_detector.py",
  "tests/test_yolo_slot_detector.py"
]
forbid = []
max_files = 2
max_diff_lines = 250

[context]
hints = [
  "models/slot_detector.onnx: 이미 12.2MB로 추출된 단일 진실 ONNX 가중치 파일",
  "CLASS_NAMES = {0: 'mod_slot', 1: 'empty_slot', 2: 'name_header', 3: 'arcane_slot', 4: 'riven_slot'}",
  "ONNX 입력 텐서: (1, 3, 640, 640), float32, img/255.0. 원본 종횡비 유지(letterbox 패딩 또는 리사이즈)",
  "ONNX 출력 텐서: (1, 9, 8400) -> [cx, cy, w, h, s0, s1, s2, s3, s4]. cv2.dnn.NMSBoxes 또는 numpy NMS로 박스 디코딩",
  "반환 딕셔너리: name_header_box, special_slots, main_slots, arcane_slots, total_detected, equipped_slot_count 키 유지"
]

[acceptance]
cases = [
  "YOLOSlotDetector.is_available() == True when models/slot_detector.onnx exists",
  "torch 또는 ultralytics 임포트 없이 onnxruntime으로 추론 수행",
  "detect_layout()이 기존과 동일한 형태의 슬롯 분류 딕셔너리를 정상 반환",
  "pytest tests/test_yolo_slot_detector.py 100% 통과"
]
commands = [
  "python -m pytest tests/test_yolo_slot_detector.py"
]

[limits]
max_attempts = 3
