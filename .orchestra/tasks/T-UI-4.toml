# Task packet T-UI-4
id    = "T-UI-4"
title = "LayeredPetRenderer 다관절 위상차 부유 모션 및 좌우 손 독립 애니메이션 리팩토링"
tier  = 2

goal = """
scripts/layered_pet_renderer.py의 LayeredPetRenderer를 단일 평행이동 방식에서 벗어나,
다관절 위상차(Phase-Shifted) 부유 물리, 좌우 손 독립 트랜스폼 및 대화/감정 반응 모션 엔진으로 전면 업그레이드하고
tests/test_emotion_animation.py로 단위 검증한다.

1. 레이어별 독립 트랜스폼 (Independent Multi-Phase Transform):
   - 기존의 단일 painter.translate(0, y_offset) 블록을 해체하고, 각 부위별 독립 painter.save()/restore() 제어.
   - 몸체 (Body):
     * y_body = sin(tick * 0.08) * amp (부드러운 호흡 부유)
     * rot_body = sin(tick * 0.04) * 1.5° (좌우 미세한 갸웃거림)
   - 왼손 (Left Hand):
     * assets/character/layers/hands/hand_left*.png가 있으면 우선 렌더링.
     * y_lh = y_body * 0.4 + sin(tick * 0.10 + 1.4) * (amp * 1.3) (몸체보다 살짝 늦게 따라오는 후행 관성)
     * x_lh = cos(tick * 0.06 + 0.5) * 1.5 (미세한 좌우 유영)
   - 오른손 (Right Hand):
     * assets/character/layers/hands/hand_right*.png가 있으면 우선 렌더링.
     * y_rh = y_body * 0.4 + sin(tick * 0.09 + 2.8) * (amp * 1.3) (왼손과 다른 위상각으로 자연스러운 비대칭 유영)
   - 하위 호환성 (Fallback):
     * 좌/우 분리 파일이 없을 경우 기존의 hand_*.png를 단일 일체형으로 안전하게 렌더링.

2. 발화 리듬 손짓 제스처 (Talking Gestures):
   - self.is_talking == True 시:
     * 입 립싱크(mouth_frame_index)와 동기화하여, 오른손이 리듬에 맞춰 가볍게 위아래로 뜀 (gesture_y = sin(talk_tick * 0.25) * 5).
     * 발화 시 몸체 틸트에 미세한 끄덕임(Nodding: tilt += 1.5°) 가미.

3. 글리치 고주파 지터 떨림 (Glitch Jitter):
   - self.mood == 'glitch' 시:
     * 프레임마다 불규칙한 고주파 진동 적용 (jitter_x = random.randint(-2, 2), jitter_y = random.randint(-2, 2)).
     * 손 파츠에 떨림 효과를 주어 위협적이고 불안정한 오르단 카리스 인격 연출.

4. 단위 테스트 (tests/test_emotion_animation.py):
   - headless 환경에서 LayeredPetRenderer가 왼손과 오른손에 서로 다른 오프셋을 계산하는지 검증.
   - is_talking 상태에서 제스처 오프셋이 적용되는지 검증.
   - glitch 상태에서 지터 오프셋이 적용되는지 검증.
   - 기존의 모든 테스트(5개) 100% 회귀 없이 통과.
"""

[scope]
allow = [
  "scripts/layered_pet_renderer.py",
  "tests/test_emotion_animation.py"
]
forbid = [
  "scripts/desktop_companion.py",
  "scripts/warframe_damage_engine.py"
]
max_files = 2
max_diff_lines = 250

[context]
hints = [
  "scripts/layered_pet_renderer.py: LayeredPetRenderer.paintEvent() - painter.translate/rotate 분리 적용",
  "assets/character/layers/hands/: hand_left.png, hand_right.png, hand_left_happy.png, hand_right_happy.png",
  "tests/test_emotion_animation.py: test_layered_pet_renderer_headless - 기존 단위 테스트"
]

[acceptance]
cases = [
  "renderer._compute_hand_offsets(tick)가 왼손과 오른손에 대해 서로 다른 y 오프셋을 반환함",
  "renderer.start_talking() 후 tick 진행 시 손 제스처 오프셋이 활성화됨",
  "renderer.set_mood('glitch') 시 jitter 오프셋이 발생함",
  "pytest tests/test_emotion_animation.py 100% 통과"
]
commands = ["python -m pytest tests/test_emotion_animation.py -v"]

[limits]
max_attempts = 3
