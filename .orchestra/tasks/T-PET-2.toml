# Task packet. Written by the orchestrator (CEO), never by the builder.
id    = "T-PET-2"
title = "점프 헤일로 클리핑 해결, 쫀득한 스쿼시앤스트레치 모핑 및 E키 양손 참격 모션 전환"
tier  = 2

goal = """
1. 점프(Space) 시 헤일로 상단이 캔버스 경계에 잘리는 클리핑 문제를 상단 안전 여백 확보 및 캔버스 확장으로 완전 해결한다.
2. 점프 시 도약(Stretch: 수직으로 길쭉)과 착지(Squish: 쫀득하게 찌그러짐 후 복원)의 젤리/스쿼시앤스트레치 물리 모핑을 적용한다.
3. E키 근접 공격(Melee) 시 몸체 회전 대신 양손이 전방을 가르며 맹렬하게 베어내는 양손 참격(Slash Hands Impulse) 모션으로 전환한다.
"""

[scope]
allow = [
  "scripts/layered_pet_renderer.py",
  "scripts/desktop_companion.py",
  "tests/test_game_input_listener.py"
]
forbid = [
  "scripts/warframe_damage_engine.py",
  "scripts/damage_formulas.py"
]
max_files = 3
max_diff_lines = 220

[context]
hints = [
  "scripts/layered_pet_renderer.py: 1) 클리핑 해결 - 현재 140x140 캔버스에 target_rect=(6, 6, 128, 128)이라 점프(-18px) 시 상단 헤일로가 위젯 밖으로 잘림. 위젯 크기를 160x160으로 확장하고 기본 target_rect를 상단 여백 22px 이상 확보(예: QRect(16, 22, 128, 128))하여 점프 최고점에서도 헤일로가 상단 0px 이상에 여유 있게 머무르도록 클리핑 제거.",
  "scripts/layered_pet_renderer.py: 2) 쫀득한 점프 모핑(Squish & Stretch) - morph_scale_x, morph_scale_y, morph_target_scale_x, morph_target_scale_y 추가. 점프 시 morph_scale_y = 1.25, morph_scale_x = 0.85로 스트레치 후 착지 시점에 반동 squish 거쳐 1.0으로 복원. apply_body_transform() 중심점(cx, cy) 기준으로 painter.scale(self.morph_scale_x, self.morph_scale_y) 적용.",
  "scripts/layered_pet_renderer.py: 3) E키 양손 참격 모션 - melee 액션 시 motion_offset_rot 회전 대신 손 오프셋 전용 임펄스(hand_motion_l, hand_motion_r) 적용. 오른손은 대각선 베기(+24px, -18px), 왼손은 가드 반동(-12px, +8px)을 준 후 _step_motion()에서 0으로 스프링 복원. _compute_hand_offsets()에 손 모션 오프셋 합성.",
  "scripts/desktop_companion.py: DesktopPet 위젯 크기 및 위치가 확장된 렌더러(160x160)에 맞게 자연스럽게 수용되도록 레이아웃 확인.",
  "tests/test_game_input_listener.py: E키 melee 시 몸체 rot 회전이 아닌 손 참격 오프셋이 발화하는지, 점프 시 morph_scale이 쫀득하게 변조된 후 1.0으로 복원되는지, 점프 최고점 좌표가 캔버스 상단 여백 내에 안전하게 머무는지 검증 추가."
]

[acceptance]
cases = [
  "점프(Space) 시 렌더링 최고점(target_rect.y() + motion_offset_y)이 0 이상(클리핑 마진 확보)이어야 함",
  "점프 발동 시 morph_scale_y > 1.15 (도약 스트레치) 발생 후 틱 진행에 따라 1.0으로 쫀득하게 수렴 복귀",
  "E키 근접 공격(melee) 시 몸체 회전(motion_offset_rot)은 0이고 양손에 참격 임펄스가 부여된 후 0으로 수렴 복귀"
]
commands = [
  "python -m pytest -q tests/test_game_input_listener.py tests/test_emotion_animation.py"
]

[limits]
max_attempts = 3
