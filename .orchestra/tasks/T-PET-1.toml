# Task packet. Written by the orchestrator (CEO), never by the builder.
id    = "T-PET-1"
title = "워프레임 인게임 WASD/Space/E/마우스 입력 연동 데스크톱 펫 실시간 반응 구현"
tier  = 2

goal = """
워프레임 게임 실행 중 오퍼레이터의 인게임 조작(WASD 이동, Space 점프, E 근접 공격, 마우스 좌클릭 사격)을
비침습적(Zero-Touch)으로 감지하여 데스크톱 펫(LayeredPetRenderer)이 부드러운 물리 역학(스프링 감쇠 모멘텀)으로
실시간 반응하도록 하고, WF-Companion 채팅창 활성화 시에는 무빙을 안전하게 일시 정지(Pause)한다.
"""

[scope]
allow = [
  "scripts/game_input_listener.py",
  "scripts/layered_pet_renderer.py",
  "scripts/desktop_companion.py",
  "tests/test_game_input_listener.py"
]
forbid = [
  "scripts/warframe_damage_engine.py",
  "scripts/damage_formulas.py"
]
max_files = 4
max_diff_lines = 280

[context]
hints = [
  "scripts/game_input_listener.py: 신규 모듈. ctypes.windll.user32.GetAsyncKeyState(VK)를 사용한 100% 비침습 키/마우스 리스너. 게임 프로세스에 OpenProcess나 SendInput을 절대 사용하지 않음. 대상 키: VK_KEY_W(0x57), VK_KEY_A(0x41), VK_KEY_S(0x53), VK_KEY_D(0x44), VK_SPACE(0x20), VK_KEY_E(0x45), VK_LBUTTON(0x01). 활성 윈도우 타이틀에 'Warframe'이 포함된 경우에만 폴링 (테스트/모의 환경을 위한 force_active_for_test 지원). QTimer 50ms 폴링 및 motion_event_signal(str, bool) [action_name, is_down] 발화. pause()/resume() 인터페이스 제공.",
  "scripts/layered_pet_renderer.py: motion_offset_x, motion_offset_y, motion_offset_rot 및 motion_target_x, motion_target_y, motion_target_rot 변수 추가. _on_bounce_tick()에서 (target - curr) * 0.25 스프링 보간. apply_motion_action(action: str, is_down: bool): 'w', 's', 'a', 'd' 키 누름/뗌에 따라 target 갱신. 'jump'(Space)는 impulse_y = -18, 'melee'(E)는 impulse_rot = 25, 'shoot'(LButton)은 impulse_x = -3, impulse_y = +2 임펄스 부여 후 자동 감쇠 복귀.",
  "scripts/desktop_companion.py: DesktopPet에 GameInputListener 인스턴스를 부착하고 렌더러의 apply_motion_action에 시그널 연결. OrdisCompanionApp의 animate_show() 또는 입력창 포커스 시 listener.pause(), animate_hide() 시 listener.resume() 연동.",
  "tests/test_game_input_listener.py: 단위 테스트. GetAsyncKeyState 모의(mock)를 통한 키 감지 및 시그널 검증, 채팅창 활성 시 pause 검증, LayeredPetRenderer의 물리 임펄스 및 감쇠 복원 검증."
]

[acceptance]
cases = [
  "game_input_listener가 GetAsyncKeyState를 사용하여 W, A, S, D, Space, E, LButton 입력을 올바르게 감지하고 시그널을 발행함",
  "WF-Companion 채팅 패널이 열리거나 listener.pause() 호출 시 키 감지 및 펫 모션이 일시 정지됨",
  "LayeredPetRenderer.apply_motion_action('jump', True) 호출 시 y 오프셋이 음수(상승)로 튀어오른 후 틱 진행에 따라 0으로 수렴 복원됨",
  "LayeredPetRenderer.apply_motion_action('melee', True) 호출 시 회전 오프셋(rot)이 발생한 후 틱 진행에 따라 0으로 수렴 복원됨",
  "LayeredPetRenderer.apply_motion_action('shoot', True) 호출 시 x 오프셋(반동)이 발생한 후 틱 진행에 따라 0으로 수렴 복원됨"
]
commands = [
  "python -m pytest -q tests/test_game_input_listener.py tests/test_emotion_animation.py tests/test_companion_app.py"
]

[limits]
max_attempts = 3
