<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WF-Optimizer (Gemma 4 E4B AI)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #131924;
            --bg-card: #1c2436;
            --accent-gold: #c89b3c;
            --accent-blue: #00e5ff;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --border: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
        .logo span { font-size: 0.8rem; background: var(--bg-card); color: var(--accent-blue); padding: 2px 8px; border-radius: 12px; }
        .model-status { font-size: 0.85rem; color: #3fb950; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; background: #3fb950; border-radius: 50%; box-shadow: 0 0 8px #3fb950; }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 960px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.bot {
            align-self: flex-start;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .user .avatar { background: var(--accent-gold); color: #000; }
        .bot .avatar { background: var(--accent-blue); color: #000; }
        
        .bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .user .bubble {
            background: #1f293d;
            border-color: var(--accent-gold);
        }
        .bubble table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        .bubble th, .bubble td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .bubble th { background: var(--bg-card); color: var(--accent-gold); }
        .bubble pre { background: var(--bg-primary); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
        .bubble code { font-family: monospace; color: var(--accent-blue); }

        .input-bar {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
        }
        .input-box {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }
        input[type="text"] {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 14px 18px;
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent-gold); }
        button {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.15); transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .examples {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            max-width: 960px;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
        }
        .chip {
            font-size: 0.78rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-dim);
        }
        .chip:hover { border-color: var(--accent-blue); color: var(--text-main); }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <span>WF</span> Warframe Build Optimizer
        </div>
        <div class="model-status">
            <div class="dot"></div>
            <span>Gemma 4 E4B 엔진 구동 중</span>
        </div>
    </header>

    <div class="chat-container" id="chat">
        <div class="message bot">
            <div class="avatar">AI</div>
            <div class="bubble">
                안녕하세요, 텐노! <strong>Gemma 4 E4B 하이브리드 엔진</strong>이 연결되었습니다.<br>
                워프레임의 모든 데미지 수식, EHP, 실드 게이팅, 외부 시너지를 수학적으로 정밀 계산해 드립니다.<br>
                비교하고 싶은 <strong>리벤 옵션</strong>이나 <strong>워프레임 생존/딜링 모딩</strong>을 편하게 물어보세요!
            </div>
        </div>
    </div>

    <div class="input-bar">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="예: 토리드 인카논 리벤 A(치확/치피) vs B(멀샷/피해) 비교해줘, 야렐리 3번 딜링 모딩 짜줘..." />
            <button id="sendBtn" onclick="sendMessage()">질문하기</button>
        </div>
        <div class="examples">
            <div class="chip" onclick="setQuery('토리드 리벤 A(치확 120%, 치피 100%) vs 리벤 B(멀티샷 100%, 피해 100%) 중 뭐가 더 좋아?')">💡 토리드 리벤 A vs B 비교</div>
            <div class="chip" onclick="setQuery('쿠바 톤코어 강철의 길 헌터 뮤니션즈 폭격 모딩 짜줘')">💡 쿠바 톤코어 폭발/절단 모딩</div>
            <div class="chip" onclick="setQuery('야렐리 메룰리나 타고 3번 스킬 아쿠아블레이드 극딜하는 모딩 짜줘')">💡 야렐리 3번 극딜 모딩</div>
            <div class="chip" onclick="setQuery('MK1-브래튼을 강철의 길 레벨 9999에서 쓸 수 있게 시너지 플랜 짜줘')">💡 MK1-브래튼 레벨캡(Lv.9999) 플랜</div>
            <div class="chip" onclick="setQuery('노바 생존 모딩에서 Null Star 90% DR과 실드 게이팅 EHP 평가해줘')">💡 노바 90% DR 생존 분석</div>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function setQuery(text) {
            userInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const query = userInput.value.trim();
            if (!query) return;

            // 유저 메시지 추가
            appendMessage('user', query);
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            // 로딩 봇 메시지 추가
            const loadingMsg = appendMessage('bot', '<em>Gemma 4 E4B가 질문을 분석하고 정밀 시뮬레이터를 연산 중입니다...</em>');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error || `HTTP ${res.status}`);
                }
                loadingMsg.innerHTML = marked.parse(data.report || data.error || '응답을 생성하지 못했습니다.');
                if (window.renderMathInElement) {
                    renderMathInElement(loadingMsg, {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false},
                            {left: '\\(', right: '\\)', display: false},
                            {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                    });
                }
            } catch (err) {
                loadingMsg.innerHTML = `<span style="color: #f85149;">[오류 발생]: 백엔드 서버와의 통신에 실패했습니다 (${err.message})</span>`;
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chat.scrollTop = chat.scrollHeight;
            }
        }

        function appendMessage(sender, htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `
                <div class="avatar">${sender === 'user' ? 'ME' : 'AI'}</div>
                <div class="bubble">${htmlContent}</div>
            `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
            return msgDiv.querySelector('.bubble');
        }
    </script>
</body>
</html>
